name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: build · validate · benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Validate bundled examples
        run: node dist/cli/index.js validate examples
      - name: Enforcement benchmark
        run: node benchmark/run.mjs
